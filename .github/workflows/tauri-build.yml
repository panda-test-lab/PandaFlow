name: Tauri Multiplatform Build and Release
on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (für Paketinstallation)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Rust Base
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}
          
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev bluez libjavascriptcoregtk-4.1-dev libsoup2.4-dev
          
      - name: Install JS Dependencies
        run: bun install

      - name: Verify updater signing key secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY is empty or unavailable to this workflow."
            exit 1
          fi
          echo "Updater signing key secret is available."

      - name: Build Desktop App via CLI
        if: (matrix.platform == 'windows-latest' && true) || (matrix.platform == 'macos-latest' && true) || (matrix.platform == 'ubuntu-latest' && true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUILD_FEATURES_FILE: 1
        run: bun run tauri build

      - name: Upload Desktop Artifacts to GitHub Release
        if: (matrix.platform == 'windows-latest' && true) || (matrix.platform == 'macos-latest' && true) || (matrix.platform == 'ubuntu-latest' && true)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/target/release/bundle/ -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.dmg" -o -name "*.AppImage" \) -exec gh release upload ${{ github.ref_name }} "{}" --clobber \;

  build-mobile:
    name: Mobile Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (für Paketinstallation)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Rust Base
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-ios' || (matrix.platform == 'ubuntu-latest' && 'aarch64-linux-android' || '') }}
      - name: Setup Java (für Android)
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.platform == 'ubuntu-latest'
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Install Android NDK
        if: matrix.platform == 'ubuntu-latest'
        run: |
          # Erzwingt den Download neu, falls der Google-Server zickt
          sdkmanager --update || true
          sdkmanager "ndk;26.1.10909125" --channel=0 || sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

          
      - name: Install JS Dependencies
        run: bun install

      - name: Build iOS App via CLI
        if: matrix.platform == 'macos-latest'
        env:
          TAURI_BUILD_FEATURES_FILE: 1
        run: |
          bun run tauri ios init || true
          bun run tauri ios build --target x86_64
          
      - name: Zip and Upload iOS to Release
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/gen/apple/build/
          zip -r ../../../../ESM-iOS-Simulator.zip .
          cd ../../../..
          gh release upload ${{ github.ref_name }} ESM-iOS-Simulator.zip --clobber

      - name: Build Android App via CLI
        if: matrix.platform == 'ubuntu-latest'
        env:
          TAURI_BUILD_FEATURES_FILE: 1
        run: |
          bun run tauri android init || true
          bun run tauri android build

      - name: Upload Android APK to Release
        if: matrix.platform == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_file=$(find src-tauri/gen/android/ -name "*.apk" | head -n 1)
          if [ -n "$apk_file" ]; then
            gh release upload ${{ github.ref_name }} "$apk_file" --clobber
          else
            echo "Keine APK-Datei für den Upload gefunden!"
            exit 1
          fi
