name: Tauri Multiplatform Build and Release
on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun (für Paketinstallation)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install Rust Base
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}
          
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev bluez libjavascriptcoregtk-4.1-dev libsoup2.4-dev
          
      - name: Install JS Dependencies
        run: bun install

      - name: Build Desktop App via CLI
        if: (matrix.platform == 'windows-latest' && true) || (matrix.platform == 'macos-latest' && true) || (matrix.platform == 'ubuntu-latest' && true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          TAURI_BUILD_FEATURES_FILE: 1
        run: bun run tauri build

      - name: Upload Desktop Artifacts to GitHub Release
        if: (matrix.platform == 'windows-latest' && true) || (matrix.platform == 'macos-latest' && true) || (matrix.platform == 'ubuntu-latest' && true)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find src-tauri/target/release/bundle/ -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.dmg" -o -name "*.AppImage" \) -exec gh release upload ${{ github.ref_name }} "{}" --clobber \;
